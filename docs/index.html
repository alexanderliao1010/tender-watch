<title>新竹桃園招標中工程案</title>

<style>
:root{
  --paper:#F4F6F5; --card:#FFFFFF; --ink:#1D2733; --muted:#5B6672; --line:#D4D9DC;
  --hz:#F2B705; --hsinchu:#2C7A76; --taoyuan:#484DA0;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#14191F; --card:#1B222A; --ink:#E6EAEE; --muted:#9BA5AF; --line:#2C343D;
         --hsinchu:#62B9B3; --taoyuan:#9195E3; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.25;margin:0 0 6px;font-weight:700}
.sub{color:var(--muted);margin:0 0 22px;font-size:.95rem}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-size:.95rem;padding:8px 16px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:500}
input[type=search]{flex:1 1 220px;min-width:0;font:inherit;font-size:.95rem;padding:8px 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--hz);outline-offset:2px}
.count{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.head,.row{display:grid;gap:4px 18px}
.head{display:none;color:var(--muted);font-size:.82rem;padding:0 16px 6px}
.row{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);
  border-radius:6px;padding:14px 16px;margin-bottom:8px;
  grid-template-columns:1fr auto;grid-template-areas:"name left" "budget budget" "period period" "dl dl" "open open" "info info"}
.row.urgent{border-left-color:transparent;
  border-image:repeating-linear-gradient(-45deg,var(--hz) 0 8px,var(--ink) 8px 16px) 0 0 0 6 / 0 0 0 6px}
.left{grid-area:left;font-weight:700;white-space:nowrap;align-self:start}
.urgent .left{color:var(--ink);background:var(--hz);padding:0 8px;border-radius:4px}
.name{grid-area:name;min-width:0}
.name a{color:var(--ink);font-weight:500;text-decoration:none}
.name a:hover{text-decoration:underline}
.unit{color:var(--muted);font-size:.88rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:.78rem;font-weight:700;color:#fff;padding:0 7px;border-radius:4px}
.tag.新竹{background:var(--hsinchu)} .tag.桃園{background:var(--taoyuan)}
.budget{grid-area:budget}.period{grid-area:period}.dl{grid-area:dl}.open{grid-area:open}
.info{grid-area:info;display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px}
.info span{font-size:.85rem;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 8px;max-width:100%}
.info span b{font-weight:400;color:var(--muted);margin-right:4px}
.cell{font-size:.92rem}
.cell b{font-weight:400;color:var(--muted);margin-right:6px}
.dl strong{font-weight:700}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
footer{margin-top:28px;color:var(--muted);font-size:.82rem}
footer a{color:inherit}
@media (min-width:900px){
  .head,.row{grid-template-columns:92px minmax(0,1fr) 108px 196px 150px 150px;align-items:center;
    grid-template-areas:"left name budget period dl open" ". info info info info info"}
  .info b{display:inline !important}
  .head{display:grid}
  .cell b{display:none}
  .budget{text-align:right}
}
</style>
</head>

const WD = "日一二三四五六";
let region = "", query = "";

function roc(iso, withTime){
  if(!iso) return "—";
  const d = new Date(iso);
  const p = n => String(n).padStart(2,"0");
  let s = `${d.getFullYear()-1911}/${p(d.getMonth()+1)}/${p(d.getDate())}（${WD[d.getDay()]}）`;
  if(withTime) s += ` ${p(d.getHours())}:${p(d.getMinutes())}`;
  return s;
}
function wan(n){ return (n/10000).toLocaleString("zh-TW",{maximumFractionDigits:1}) + " 萬"; }
function daysLeft(iso){
  const ms = new Date(iso) - new Date();
  if(ms <= 0) return null;
  const d = Math.floor(ms/86400000);
  return d === 0 ? "今天截止" : `剩 ${d} 天`;
}
function esc(s){ const e=document.createElement("span"); e.textContent=s||""; return e.innerHTML; }

function render(){
  const q = query.trim();
  const rows = DATA.filter(t =>
    (!region || t.region === region) &&
    (!q || (t.title+t.unit+t.job).includes(q)) &&
    daysLeft(t.deadline));
  document.getElementById("count").textContent = `共 ${rows.length} 案`;
  const list = document.getElementById("list");
  if(!rows.length){
    list.innerHTML = `<div class="empty">${DATA.length ? "沒有符合篩選的案子，換個地區或關鍵字試試。" : "目前沒有符合條件的招標案，明天早上會再更新。"}</div>`;
    return;
  }
  list.innerHTML = rows.map(t => {
    const left = daysLeft(t.deadline);
    const urgent = (new Date(t.deadline) - new Date()) < 3*86400000;
    const title = t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a>` : esc(t.title);
    return `<article class="row${urgent?" urgent":""}">
      <div class="left">${left}</div>
      <div class="name">${title}
        <div class="unit"><span class="tag ${t.region}">${t.region}</span>${esc(t.unit)}</div>
      </div>
      <div class="cell budget"><b>預算</b>${wan(t.budget)}</div>
      <div class="cell period"><b>招標期間</b>${roc(t.announce)} – ${roc(t.deadline)}</div>
      <div class="cell dl"><b>截止投標</b><strong>${roc(t.deadline,true)}</strong></div>
      <div class="cell open"><b>開標</b>${roc(t.opening,true)}</div>
      <div class="info">
        <span><b>決標方式</b>${esc(t.award)||"—"}</span>
        <span><b>履約期限</b>${esc(t.period)||"—"}</span>
        <span><b>押標金</b>${esc(t.bond)||"—"}</span>
      </div>
    </article>`;
  }).join("");
}

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  region = b.dataset.r;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x===b));
  render();
}));
document.getElementById("q").addEventListener("input", e => { query = e.target.value; render(); });
render();
</script>
