name: 每日更新招標清單

on:
  schedule:
    - cron: "0 22 * * *"   # 台灣時間每天早上 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python update_tenders.py
      - name: 提交更新
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "更新招標清單 $(TZ=Asia/Taipei date +%F)"
          git push
